name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
  REGISTRY: gcr.io
  IMAGE_NAME: llm-chat-completion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run linting
      run: |
        black --check src tests
        flake8 src tests
        mypy src

    - name: Run unit tests
      run: |
        pytest tests/unit --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker
      run: gcloud auth configure-docker

    - name: Build and push Docker image
      run: |
        docker build -t $REGISTRY/$GCP_PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA .
        docker push $REGISTRY/$GCP_PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA
        docker tag $REGISTRY/$GCP_PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA $REGISTRY/$GCP_PROJECT_ID/$IMAGE_NAME:latest
        docker push $REGISTRY/$GCP_PROJECT_ID/$IMAGE_NAME:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to Cloud Run (Staging)
      run: |
        gcloud run deploy llm-chat-api-staging \
          --image $REGISTRY/$GCP_PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA \
          --platform managed \
          --region $GCP_REGION \
          --allow-unauthenticated \
          --memory 4Gi \
          --cpu 2 \
          --max-instances 5 \
          --set-env-vars MODEL_PATH=gs://$GCS_BUCKET/models/staging

  integration-tests:
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run integration tests
      run: |
        pytest tests/integration
      env:
        STAGING_ENDPOINT: ${{ secrets.STAGING_ENDPOINT }}

  deploy-production:
    needs: integration-tests
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to Cloud Run (Production)
      run: |
        gcloud run deploy llm-chat-api \
          --image $REGISTRY/$GCP_PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA \
          --platform managed \
          --region $GCP_REGION \
          --allow-unauthenticated \
          --memory 8Gi \
          --cpu 4 \
          --max-instances 20 \
          --min-instances 2 \
          --set-env-vars MODEL_PATH=gs://$GCS_BUCKET/models/production